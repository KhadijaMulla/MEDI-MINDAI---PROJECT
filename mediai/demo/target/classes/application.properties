server.port=8082
# ---- MySQL ----
# The database "medimind" is created automatically if it does not exist.
# Change the username and password to your own MySQL login.
spring.datasource.url=jdbc:mysql://localhost:3306/medimind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates and updates tables automatically; existing data is kept
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Prescription image upload limit (matches the frontend's 5 MB check)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB